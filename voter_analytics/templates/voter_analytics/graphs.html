<!-- Clemens Li | cl750@bu.edu | Graph Listing Template -->
{% extends "voter_analytics/base.html" %}

{% block content %}
    <h1>Voter Graphs</h1>
    <p><a href="{% url 'voters' %}">Voter list</a></p>

    <form method="get" action="{% url 'graphs' %}">
        <label for="party">Party:</label>
        <select name="party" id="party">
            <option value="">All</option>
            {% for party_code in parties %}
                <option value="{{ party_code }}"
                    {% if request.GET.party == party_code %}selected{% endif %}>
                    {{ party_code }}
                </option>
            {% endfor %}
        </select>

        <label for="min_dob">Born after:</label>
        <select name="min_dob" id="min_dob">
            <option value="">Any year</option>
            {% for year in years %}
                <option value="{{ year }}"
                    {% if request.GET.min_dob == year|stringformat:"s" %}selected{% endif %}>
                    {{ year }}
                </option>
            {% endfor %}
        </select>

        <label for="max_dob">Born before:</label>
        <select name="max_dob" id="max_dob">
            <option value="">Any year</option>
            {% for year in years %}
                <option value="{{ year }}"
                    {% if request.GET.max_dob == year|stringformat:"s" %}selected{% endif %}>
                    {{ year }}
                </option>
            {% endfor %}
        </select>

        <label for="score">Voter score:</label>
        <select name="score" id="score">
            <option value="">Any score</option>
            {% for score in "012345" %}
                <option value="{{ score }}"
                    {% if request.GET.score == score %}selected{% endif %}>
                    {{ score }}
                </option>
            {% endfor %}
        </select>

        <p><label><input type="checkbox" name="v20state" {% if request.GET.v20state %}checked{% endif %}> 2020 State election</label></p>
        <p><label><input type="checkbox" name="v21town" {% if request.GET.v21town %}checked{% endif %}> 2021 Town election</label></p>
        <p><label><input type="checkbox" name="v21primary" {% if request.GET.v21primary %}checked{% endif %}> 2021 Primary election</label></p>
        <p><label><input type="checkbox" name="v22general" {% if request.GET.v22general %}checked{% endif %}> 2022 General election</label></p>
        <p><label><input type="checkbox" name="v23town" {% if request.GET.v23town %}checked{% endif %}> 2023 Town election</label></p>

        <button type="submit">Update graphs</button>
        <a href="{% url 'graphs' %}">Clear filters</a>
    </form>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    {{ birth_chart }} <!-- Histogram for Voters by birth year -->
    {{ party_chart }} <!-- Pie chart for Voters by party affiliation -->
    {{ election_chart }} <!-- Histogram for Voters by Election Participation per year -->
{% endblock %}
