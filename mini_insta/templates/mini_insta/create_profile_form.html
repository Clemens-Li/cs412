<!-- Clemens Li cl750@bu.edu | Page form for creating a Profile -->
 {% extends "mini_insta/base.html" %}

 {% block content %}

 <h2>Create A New Profile</h2>

<form action="{% url 'create_profile' %}" method="POST" enctype="multipart/form-data"> <!-- Will direct to the create_post URL and POST after submission -->
    {% csrf_token %} <!-- for verification -->
    <table>
        <h3>Login Account</h3>
        <p>Choose the username and password you'll use to log in.</p>
        {{user_form.as_p}} <!-- User form -->

        <h3>Account Details</h3> <!-- There's two usernames, make sure there's no confusion -->
        <p>Choose what people will see on your Instagram profile.</p>
        {{form.as_p}} <!-- The actual form for Profile-->
    </table>
    <input type="submit" name="submit" value="Submit">
    <a href="{% url 'show_all_profiles' %}">Cancel</a>
</form>

{% endblock %}
