<!--Order page-->
{% extends "restaurant/base.html" %}

{% block content %}
    <h2>Place an Ice Cream Order!</h2>

    <form method="post" action="{% url 'confirmation' %}">
        {% csrf_token %}

        <h4>Standard Menu</h4>

        <label>
            Vanilla Cone $4.00
            <input type="checkbox" name="vanilla" value="Vanilla Cone">
        </label><br>

        <label>
            Chocolate Cone $4.50
            <input type="checkbox" name="chocolate" value="Chocolate Cone">
        </label><br>

        <label>
            Strawberry Cone $4.25
            <input type="checkbox" name="strawberry" value="Strawberry Cone">
        </label><br>

        <label>
            Milkshake $5.00
            <input type="checkbox" name="milkshake" value="Milkshake">
        </label><br>

        <h4>Daily Special $6.00</h4>
        <label>
            {{ special }}
            <input type="checkbox" name="daily_special" value="{{ special }}" checked>
        </label><br>

        <h4>Special Instructions</h4>
        <textarea name="special_instructions" rows="4" cols="40"></textarea><br><br>

        <h4>Customer Information</h4>
        <label>
            Name:
            <input type="text" name="customer_name" required>
        </label><br><br>

        <label>
            Email:
            <input type="text" name="customer_email" required>
        </label><br><br>

        <button type="submit">Place Order</button>
    </form>
{% endblock %}
